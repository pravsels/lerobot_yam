[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yam-common"
version = "0.2.0"
description = "Hardware controller and shared utilities for YAM arms"
readme = "README.md"
authors = [
  { name = "Praveen Selvaraj" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "mujoco",
  "python-can",
]

[project.urls]
homepage = "https://github.com/pravsels/lerobot_yam"
source = "https://github.com/pravsels/lerobot_yam"
issues = "https://github.com/pravsels/lerobot_yam/issues"


[tool.setuptools]
packages = ["yam_common", "yam_common.dm"]
package-dir = {"yam_common" = "yam_common"}

[tool.setuptools.package-data]
yam_common = ["robot_models/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

